<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Track</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f, #2e7d4f);
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 640px; }
    h1 { font-size: 3.5rem; letter-spacing: 0.02em; margin-bottom: 1rem; }
    p { font-size: 1.25rem; line-height: 1.6; opacity: 0.9; margin-bottom: 2.5rem; }
    .soon {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 2px solid #fff;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <main>
    <h1>On-Track</h1>
    <p>AI that helps track and field athletes know exactly what to eat before and after training or racing, based on their event and workout.</p>
    <div class="soon">Coming Soon</div>
  </main>
</body>
</html>
